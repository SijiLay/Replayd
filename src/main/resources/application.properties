spring.application.name=replayd

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/replayd}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

frontend.url=${FRONTEND_URL:http://localhost:5173}

thesportsdb.api.key=${THESPORTSDB_API_KEY}
thesportsdb.api.base-url=https://www.thesportsdb.com/api/v2/json

server.port=${PORT:8080}